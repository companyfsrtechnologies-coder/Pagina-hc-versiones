  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>inicio de cecicion de administradores</title>

        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous"
        />

        <link rel="stylesheet" href="../css/admin-and-enfermeros-estilos.css" />

        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"
        ></script>

        <meta
          name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximun-scale=1.0, minimun-scale=1.0"
        />
      </head>

      <body class="">
        <div class="bienvenida">
          <h1>Bienvenido al portal</h1>

          <img src="../img/logo-hc.png" class="logo-hc" />
        </div>

        <div class="from">
          <form class="row g-3" id="formulario">
            <div class="col-md-4">
              <label for="validationDefault01" class="form-label">
                nombre
              </label>

              <input
                type="text"
                class="form-control"
                id="validationDefault01"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="validationDefault02" class="form-label">
                apellido
              </label>

              <input
                type="text"
                class="form-control"
                id="validationDefault02"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="validationDefaultUsername" class="form-label">
                nombre de usuario
              </label>

              <div class="input-username">
                <input
                  type="text"
                  class="form-control"
                  id="validationDefaultUsername"
                  aria-describedby="inputGroupPrepend2"
                  required
                />
              </div>
            </div>

            <div class="col-md-6">
              <label for="validationDefault03" class="form-label">
                contraceña
              </label>

              <input
                type="password"
                class="form-control"
                id="validationDefault03"
                required
              />
            </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit">enviar</button>
            </div>
          </form>
        </div>

        <script src="../js/admin-verif.js"></script>
      </body>
    </html>
  </body>
</html>
