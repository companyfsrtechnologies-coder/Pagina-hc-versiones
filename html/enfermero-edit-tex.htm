<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de texto</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
      }
      .editor {
        width: 700px;
        max-width: 100%;
        margin: auto;
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
      }
      .barra-herramientas {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 10px;
        background-color: #eeeeee;
        border-bottom: 1px solid #ccc;
      }
      .barra-herramientas button {
        padding: 8px 12px;
        border: 1px solid #bbb;
        border-radius: 4px;
        background-color: white;
        cursor: pointer;
      }
      .barra-herramientas button:hover {
        background-color: #ddd;
      }
      .area-texto {
        min-height: 400px;
        padding: 20px;
        outline: none;
        font-size: 16px;
        line-height: 1.5;
      }
      .contenedor-publicar {
        padding: 15px;
        text-align: right;
        border-top: 1px solid #ccc;
      }
      .boton-publicar {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #198754;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }
      .boton-publicar:hover {
        background-color: #146c43;
      }
    </style>
  </head>
  <body>
    <div class="editor">
      <div class="barra-herramientas">
        <button type="button" onclick="formato('bold')"><b>B</b></button>
        <button type="button" onclick="formato('italic')"><i>I</i></button>
        <button type="button" onclick="formato('underline')"><u>U</u></button>
        <button type="button" onclick="formato('justifyLeft')">
          Izquierda
        </button>
        <button type="button" onclick="formato('justifyCenter')">
          Centrar
        </button>
        <button type="button" onclick="formato('justifyRight')">Derecha</button>
        <button type="button" onclick="formato('justifyFull')">
          Justificar
        </button>
        <button type="button" onclick="formato('insertUnorderedList')">
          Lista
        </button>
      </div>
      <div id="areaTexto" class="area-texto" contenteditable="true">
        Escribí tu documento aquí...
      </div>
      <div class="contenedor-publicar">
        <button
          type="button"
          class="boton-publicar"
          onclick="publicarDocumento()"
        >
          Publicar documento
        </button>
      </div>
    </div>
    <script>
      function formato(comando) {
        const editor = document.getElementById("areaTexto");
        editor.focus();
        document.execCommand(comando, false, null);
      }
      function publicarDocumento() {
        const editor = document.getElementById("areaTexto");
        const contenido = editor.innerHTML;
        if (contenido.trim() === "") {
          alert("El documento está vacío.");
          return;
        }
        console.log("Documento:");
        console.log(contenido);
        alert("Documento publicado correctamente.");
      }
    </script>
  </body>
</html>
